[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-dpo"
version = "0.1.0"
description = "Video-DPO: Temporal Consistency Alignment for AnimateDiff using Direct Preference Optimization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Video-DPO Team"}
]
keywords = ["diffusion", "video", "dpo", "animatediff", "temporal-consistency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy<2.0.0",
    "torch>=2.1.0",
    "diffusers>=0.26.0",
    "transformers",
    "accelerate",
    "peft",
    "safetensors",
    "pyyaml",
    "tqdm",
    "einops",
    "imageio[ffmpeg]",
]

[project.optional-dependencies]
eval = [
    "opencv-python>=4.8.0",
    "scipy",
]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/video-dpo/video-dpo"
Documentation = "https://github.com/video-dpo/video-dpo#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100
